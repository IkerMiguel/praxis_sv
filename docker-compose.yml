services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: praxis_sv-app
    container_name: praxis_sv_app
    restart: unless-stopped
    ports:
      - "8000:8080"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: praxis_sv
      DB_USERNAME: praxis
      DB_PASSWORD: praxis_secret
      CACHE_STORE: database
      SESSION_DRIVER: database
      QUEUE_CONNECTION: database
      LOG_CHANNEL: stderr
      FRONTEND_URL: http://localhost:3000
      PRAXIS_REFRESH_COOKIE_SECURE: "false"
      PRAXIS_REFRESH_COOKIE_SAMESITE: lax
      # Nginx solo en IPv4: evita fallos en hosts sin IPv6 habilitado.
      NGINX_LISTEN_IP_PROTOCOL: ipv4
    volumes:
      - praxis_sv_storage:/var/www/html/storage/app
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/up > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  scheduler:
    image: praxis_sv-app
    container_name: praxis_sv_scheduler
    restart: unless-stopped
    command: ["php", "/var/www/html/artisan", "schedule:work"]
    healthcheck:
      test: ["CMD", "healthcheck-schedule"]
      start_period: 10s
    environment:
      APP_ENV: local
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: praxis_sv
      DB_USERNAME: praxis
      DB_PASSWORD: praxis_secret
      CACHE_STORE: database
      LOG_CHANNEL: stderr
      NGINX_LISTEN_IP_PROTOCOL: ipv4
    depends_on:
      app:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: praxis_sv_postgres
    restart: unless-stopped
    ports:
      # 5433 en el host evita choque si ya hay otro Postgres en 5432
      - "5433:5432"
    environment:
      POSTGRES_DB: praxis_sv
      POSTGRES_USER: praxis
      POSTGRES_PASSWORD: praxis_secret
    volumes:
      - praxis_sv_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U praxis -d praxis_sv"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  praxis_sv_pgdata:
  praxis_sv_storage:
